<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScanHub Triage</title>
<!-- Design C "Triage". Visual rules follow unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --deep:#07080d;--bg:#0b0d14;--card:#11141c;--raised:#1a1e28;--raised2:#212634;
  --line:rgba(238,240,245,.08);--line2:rgba(238,240,245,.13);
  --t1:#eef0f5;--t2:#a3a9b8;--t3:#7a8296;
  --accent:#5cc8d6;--accent-soft:rgba(92,200,214,.12);
  --critical:#e5484d;--high:#e0844f;--medium:#cfae55;--low:#7f9dc4;--info:#7a8296;
  --pos:#4cc38a;--neg:#e5484d;--neg-t:#f07a7e;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t1);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--t3)}.sec{color:var(--t2)}
.sep{color:var(--t3);padding:0 6px}
svg.lucide{width:16px;height:16px;stroke-width:1.5;flex:none}
h1,h2,h3,p{margin:0;font-weight:500}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;background:var(--raised);border:1px solid var(--line);color:var(--t1);font-weight:500;white-space:nowrap;transition:background-color .14s var(--ease),border-color .14s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--raised2)}
.btn:active{transform:scale(.98)}
.btn svg{color:var(--t2)}
.btn.primary{background:var(--t1);color:var(--bg);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.primary svg{color:var(--bg)}
.btn.primary:hover{background:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--raised);color:var(--t1)}
.btn.danger{background:none;border-color:rgba(229,72,77,.35);color:var(--neg-t)}
.btn.danger svg{color:var(--neg-t)}
.btn.danger:hover{background:rgba(229,72,77,.08)}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--t2);transition:background-color .14s var(--ease),color .14s var(--ease)}
.icon-btn:hover{background:var(--raised);color:var(--t1)}
.icon-btn.sm{width:24px;height:24px;border-radius:6px}
.input,.select{height:36px;width:100%;padding:0 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);color:var(--t1);transition:border-color .14s var(--ease)}
.input::placeholder{color:var(--t3)}
.input:hover,.select:hover{border-color:rgba(238,240,245,.2)}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.input[disabled]{background:var(--raised);color:var(--t3)}
.sel-wrap{position:relative;display:inline-block;width:100%}
.select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}
.select option{background:var(--card)}
.sel-wrap>svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;color:var(--t2)}
.hint{font-size:12px;line-height:16px;color:var(--t3)}
.kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:4px;background:var(--raised);border:1px solid var(--line2);border-bottom-width:2px;font:500 11px/1 var(--mono);color:var(--t2)}
.switch{position:relative;width:36px;height:20px;border-radius:10px;background:var(--raised2);border:1px solid var(--line2);transition:background-color .16s var(--ease);flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:var(--t2);transition:transform .16s var(--ease),background-color .16s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg)}
.check{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;border:1px solid var(--line2);background:var(--bg);flex:none}
.check svg{width:12px;height:12px;stroke-width:2.5;color:var(--bg);opacity:0}
.on>.check,.check.on{background:var(--accent);border-color:var(--accent)}
.on>.check svg,.check.on svg{opacity:1}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--raised);border:1px solid var(--line);font:400 11px/1 var(--mono);color:var(--t2);white-space:nowrap}

/* severity */
.sd{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none;background:var(--info)}
.sd.critical{background:var(--critical)}.sd.high{background:var(--high)}.sd.medium{background:var(--medium)}.sd.low{background:var(--low)}.sd.info{background:var(--info)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.sev.critical{color:#f07a7e}.sev.high{color:#eb9c6f}.sev.medium{color:#dcc078}.sev.low{color:#9db5d6}.sev.info{color:var(--t3)}
.sevmini{display:inline-flex;gap:10px;align-items:center}
.sevmini span{display:inline-flex;align-items:center;gap:4px;font:400 12px/16px var(--mono);color:var(--t2)}
.sevmini .sd{width:6px;height:6px}
.add{color:var(--accent)}
.del{color:var(--t3)}

/* app shell */
.app{display:grid;grid-template-columns:56px minmax(0,1fr);height:100vh}
.rail{background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:5}
.logo-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);font:500 15px/1 var(--mono);color:var(--t1);margin-bottom:12px}
.rail a,.rail .rb{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--t3);transition:background-color .14s var(--ease),color .14s var(--ease)}
.rail a:hover{color:var(--t1);background:var(--card)}
.rail a.on{color:var(--t1);background:var(--raised);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.rail svg.lucide{width:18px;height:18px}
.rail [data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--raised2);border:1px solid var(--line2);color:var(--t1);font-size:12px;line-height:16px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:20}
.rail .grow{flex:1}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--raised);border:1px solid var(--line2);font:500 12px/1 var(--sans);color:var(--t2);flex:none}
.rail .rb .avatar{cursor:pointer}
.menu{position:absolute;left:52px;bottom:4px;min-width:200px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:30}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu-h{padding:8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px;border-radius:8px;color:var(--t2);text-align:left}
.menu button:hover{background:var(--raised);color:var(--t1)}
.main{min-width:0;height:100vh;overflow:auto;position:relative}

.back-link{position:fixed;right:12px;bottom:8px;z-index:40;font-size:12px;line-height:16px;color:var(--t3);padding:4px 8px;border-radius:6px;background:var(--deep);border:1px solid var(--line)}
.back-link:hover{color:var(--t1)}

/* workspace */
.ws{display:grid;grid-template-columns:260px 320px minmax(0,1fr);height:100vh}
.pane{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);overflow:hidden;position:relative}
.pane:last-child{border-right:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.ph-t{font-weight:500}
.ph-s{font-size:12px;line-height:16px;color:var(--t3)}
.scroll{overflow:auto;flex:1;min-height:0}

/* pane 1 tree */
.tree{padding:8px}
.tp{margin-bottom:12px}
.tp-h{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 8px}
.tp-h .tg{display:flex;align-items:center;gap:6px;flex:1;min-width:0;color:var(--t2);font-size:13px;height:32px;text-align:left}
.tp-h .tg svg{color:var(--t3);transition:transform .16s var(--ease)}
.tp.closed .tg svg{transform:rotate(-90deg)}
.tp.closed .tr{display:none}
.tp-h .icon-btn{opacity:0}
.tp-h:hover .icon-btn,.tp-h .icon-btn:focus-visible{opacity:1}
.tr{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:8px;row-gap:2px;padding:8px 8px;border-radius:8px;margin-top:2px;transition:background-color .14s var(--ease)}
.tr:hover{background:var(--card)}
.tr.on{background:var(--raised);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hdot{width:8px;height:8px;border-radius:4px;align-self:center;justify-self:center;background:var(--pos)}
.hdot.critical{background:var(--critical)}.hdot.high{background:var(--high)}.hdot.none{background:var(--t3)}
.tr-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-new{font:400 12px/20px var(--mono)}
.tr-meta{grid-column:2/4;font:400 12px/16px var(--mono);color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-sev{grid-column:2/4;margin-top:2px}

/* pane 2 history */
.trend{padding:16px;border-bottom:1px solid var(--line);flex:none}
.trend-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.trend-v{font:500 20px/24px var(--sans);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;font-size:12px;line-height:16px;color:var(--t3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:2px;border-radius:1px;background:var(--t3)}
.sw.a{background:var(--accent)}
.trend svg text{font:400 11px var(--mono);fill:var(--t3)}
.trend .hit{fill:transparent;cursor:pointer}
.tl-h{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;font-size:13px;color:var(--t2);flex:none}
.tl{list-style:none;margin:0;padding:0 8px 16px;position:relative}
.tl li{position:relative}
.tl li::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:1px;background:var(--line2)}
.tl li:first-child::before{top:18px}
.tl li:last-child::before{bottom:calc(100% - 18px)}
.tl-r{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px;padding:8px 8px 8px 0;border-radius:8px;transition:background-color .14s var(--ease)}
.tl-r:hover{background:var(--card)}
.tl-r.on{background:var(--raised);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tl-dot{width:9px;height:9px;border-radius:5px;background:var(--bg);border:1px solid var(--t3);justify-self:center;margin-top:6px;position:relative;z-index:1}
.tl-r.on .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-1{display:flex;align-items:center;gap:8px}
.tl-1 .tl-d{color:var(--t2);font-size:13px}
.diff{margin-left:auto;display:inline-flex;gap:8px;font:400 12px/20px var(--mono)}
.tl-2,.tl-3{display:flex;align-items:center;font-size:12px;line-height:16px;color:var(--t3);margin-top:4px;min-width:0;white-space:nowrap}
.tl-2 svg{width:14px;height:14px;margin-right:4px}
.tl-3{gap:10px}
.neg{color:var(--neg-t)}

/* pane 3 findings */
.ph3{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 24px 12px;flex:none}
.crumb{font-size:12px;line-height:16px;color:var(--t3);margin-bottom:4px}
.ph3 h1{font-size:20px;line-height:28px}
.ph3 .meta{display:flex;flex-wrap:wrap;align-items:center;font-size:12px;line-height:16px;color:var(--t3);margin-top:4px}
.ph3 .meta svg{width:14px;height:14px;margin-right:4px}
.nav-scan{display:flex;gap:4px;align-items:center}
.summary{display:grid;grid-template-columns:auto auto auto minmax(220px,1fr);gap:32px;align-items:end;padding:4px 24px 16px;flex:none}
.stat-l{font-size:12px;line-height:16px;color:var(--t3)}
.stat-v{font:500 28px/32px var(--sans);font-variant-numeric:tabular-nums;margin-top:4px}
.stat-v .mk{font-family:var(--mono);font-size:22px;margin-right:2px}
.stat-c{font-size:12px;line-height:16px;color:var(--t3);margin-top:2px}
.dist-bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:8px 0}
.dist-bar span{display:block;min-width:2px}
.dist-leg{display:flex;flex-wrap:wrap;gap:4px 12px}
.dist-leg button{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:20px;color:var(--t2);padding:0 4px;margin:0 -4px;border-radius:4px}
.dist-leg button:hover{background:var(--raised);color:var(--t1)}
.dist-leg button.on{background:var(--raised);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}
.dist-leg .mono{color:var(--t1)}
.toolrow{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 12px;flex:none}
.tchip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--t2)}
.tchip .st{width:6px;height:6px;border-radius:3px;background:var(--pos)}
.tchip.failed .st{background:var(--neg)}.tchip.skipped .st{background:var(--t3)}
.tchip.failed{border-color:rgba(229,72,77,.3)}
.tchip .mono{color:var(--t3)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.search{position:relative;flex:1 1 200px;min-width:160px}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3)}
.search .input{padding-left:32px;padding-right:36px;height:32px}
.search .kc{position:absolute;right:8px;top:6px}
.filters .sel-wrap{width:auto}
.filters .select{height:32px;font-size:13px;width:auto;min-width:96px}
.fcount{font:400 12px/16px var(--mono);color:var(--t3);margin-left:4px}
.flist{flex:1;min-height:0;overflow:auto;padding-bottom:8px}
.fg{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:32px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--t2)}
.fg .mono{color:var(--t3)}
.fr{display:grid;grid-template-columns:20px 84px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:60px;padding:8px 24px 8px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .12s var(--ease)}
.fr:hover{background:var(--card)}
.fr.sel{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.gut{font:500 14px/20px var(--mono);text-align:center;color:var(--t3);align-self:start;padding-top:2px;user-select:none}
.fr.new .gut{color:var(--accent)}
.fr .sev{align-self:start;padding-top:2px}
.fr-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-s{display:flex;align-items:center;font-size:12px;line-height:16px;color:var(--t3);margin-top:4px;overflow:hidden;white-space:nowrap}
.fr-s .mono{color:var(--t2)}
.fr-s .fix{overflow:hidden;text-overflow:ellipsis}
.fr-tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.fr.fixed .fr-t{text-decoration:line-through;text-decoration-color:var(--t3);color:var(--t3)}
.fr.fixed .sev{opacity:.6}
.help{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:40px;padding:8px 24px;padding-right:160px;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--t3);flex:none;background:var(--bg)}
.help span{display:inline-flex;align-items:center;gap:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 24px;text-align:center;color:var(--t2)}
.empty .muted{max-width:360px}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);border-left:1px solid var(--line2);box-shadow:-16px 0 32px rgba(0,0,0,.35);transform:translateX(100%);transition:transform .22s var(--ease);display:flex;flex-direction:column;z-index:10;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dr-h{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px 0 24px;border-bottom:1px solid var(--line);flex:none}
.dr-b{overflow:auto;padding:20px 24px 32px;flex:1}
.dr-b h2{font-size:18px;line-height:26px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px 12px;margin:0 0 24px;font-size:13px}
.kv dt{color:var(--t3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dr-sec{margin-top:24px}
.dr-sec h3{font-size:13px;color:var(--t2);margin-bottom:8px}
.dr-sec p{color:var(--t2);line-height:22px;font-weight:400}
.snip{margin:0;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:8px 0;overflow:auto;font:400 12px/20px var(--mono)}
.snip div{display:grid;grid-template-columns:40px 1fr;padding-right:12px;white-space:pre}
.snip .ln{color:var(--t3);text-align:right;padding-right:12px;user-select:none}
.snip .hl{background:rgba(229,72,77,.1);box-shadow:inset 2px 0 0 var(--critical)}
.fixbox{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);color:var(--t1);font-size:13px}
.fixbox svg{color:var(--pos);margin-top:2px}
.refs{display:flex;flex-direction:column;gap:6px}
.refs a{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-size:13px;overflow-wrap:anywhere}
.refs a:hover{color:var(--t1)}
.refs svg{width:14px;height:14px;color:var(--t3)}
.stbadge{font:400 12px/16px var(--mono);color:var(--t2)}
.stbadge.new{color:var(--accent)}
.stbadge.fixed{color:var(--t3)}

/* pages */
.page{max-width:1280px;padding:32px 32px 80px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-h h1{font-size:28px;line-height:36px}
.page-h p{color:var(--t2);font-weight:400;margin-top:8px;max-width:720px;line-height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h h2{font-size:15px;display:flex;align-items:center;gap:8px}
.card-h h2 svg{color:var(--t3)}
.card-h p{font-size:13px;color:var(--t3);font-weight:400;margin-top:2px}
.inner{background:var(--bg);border:1px solid var(--line);border-radius:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--t2);height:44px;padding:0 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0 16px;height:60px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}

const scansOf=id=>S.scans[id]||[];

function scanView(repoId,idx){
  return (S.findings[repoId]||[]).filter(f=>f.intro<=idx&&(f.fixed==null||f.fixed>=idx))
    .map(f=>Object.assign({},f,{status:f.fixed===idx?'fixed':f.intro===idx?'new':'existing'}));
}
function sevCounts(list){const c={critical:0,high:0,medium:0,low:0,info:0};list.forEach(f=>{if(f.status!=='fixed')c[f.sev]++});return c}
function scanStats(repoId,idx){
  const v=scanView(repoId,idx);
  const open=v.filter(f=>f.status!=='fixed');
  return {view:v,open:open.length,nNew:v.filter(f=>f.status==='new').length,nFix:v.filter(f=>f.status==='fixed').length,c:sevCounts(v)};
}
function health(repoId){const s=latest(repoId);if(!s)return 'none';const c=scanStats(repoId,s.idx).c;return c.critical?'critical':c.high?'high':'ok'}

let toastT;
function toast(msg){const t=$('#toast');t.querySelector('span').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function copy(text,btn){
  const done=()=>{toast('คัดลอกแล้ว');if(btn){btn.innerHTML=I('check');icons();setTimeout(()=>{btn.innerHTML=I('copy');icons()},1400)}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done))}else fallbackCopy(text,done);
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}

  document.body.appendChild(bg);icons();

}

function runInstall(){
  const st=S.setup, sel=TOOL_IDS.filter(t=>st.sel.has(t));let i=0;st.phase='running';render();
  const tick=setInterval(()=>{
    const t=sel[i];if(!t){clearInterval(tick);st.phase='done';
      TOOL_IDS.forEach(id=>{S.tools[id].installed=st.sel.has(id);if(st.sel.has(id)){S.tools[id].status='ok';if(!S.tools[id].updated)S.tools[id].updated=fmtDate(NOW)}});render();return}
    st.prog[t]=Math.min(100,(st.prog[t]||0)+9+Math.round(Math.random()*10));
    const row=$('#inst-'+t);if(row){row.querySelector('.prog i').style.transform=`scaleX(${st.prog[t]/100})`;const x=row.querySelector('.stx');x.textContent=st.prog[t]>=100?'ติดตั้งแล้ว':'กำลังดึง image';x.classList.toggle('ok',st.prog[t]>=100)}
    if(st.prog[t]>=100)i++;
  },90);
}

function trendSvg(repoId,curIdx){
  const scans=scansOf(repoId);const n=scans.length;
  const tot=scans.map(s=>scanStats(repoId,s.idx));
  const W=288,H=112,pl=28,pr=8,pt=8,pb=20;
  const maxV=Math.max(10,Math.ceil(Math.max(...tot.map(t=>t.open))/10)*10);
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1);
  const y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const pts=k=>tot.map((t,i)=>[x(i),y(k(t))]);
  const smooth=p=>{if(p.length<2)return `M${p[0][0]},${p[0][1]}`;let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
    for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d};
  const pT=pts(t=>t.open),pC=pts(t=>t.c.critical+t.c.high);
  const lineT=smooth(pT),lineC=smooth(pC);
  const area=`${lineT} L${x(n-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const grid=[0,maxV/2,maxV].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(238,240,245,.07)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const step=n>1?(W-pl-pr)/(n-1):W;
  const hits=scans.map((s,i)=>`<rect class="hit" x="${x(i)-step/2}" y="0" width="${step}" height="${H-pb}" data-act="pick-scan" data-no="${s.no}"><title>#${s.no} · ${fmtShort(s.date)} · open ${tot[i].open}</title></rect>`).join('');
  const ci=Math.max(0,curIdx);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="แนวโน้ม open findings">${grid}
    <path d="${area}" fill="rgba(238,240,245,.05)"/><path d="${lineT}" fill="none" stroke="#7a8296" stroke-width="1.5"/>
    <path d="${lineC}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <line x1="${x(ci)}" x2="${x(ci)}" y1="${pt}" y2="${H-pb}" stroke="rgba(238,240,245,.18)"/>
    <circle cx="${x(ci)}" cy="${y(tot[ci].open)}" r="3" fill="#a3a9b8" stroke="var(--bg)" stroke-width="2"/>
    <circle cx="${x(ci)}" cy="${y(tot[ci].c.critical+tot[ci].c.high)}" r="3" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${pl}" y="${H-4}">${fmtDay(scans[0].date)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${fmtDay(scans[n-1].date)}</text>${hits}</svg>`;
}

const fileKey=f=>f.loc.includes('@')?'Dependencies':f.loc.split(':')[0];
function computeList(){
  const {repo,scan}=S.cur;if(!scan)return {groups:[],flat:[],total:0};
  const f=S.ui.f,q=f.q.trim().toLowerCase();
  const items=scanView(repo.id,scan.idx).filter(x=>(!f.sev||x.sev===f.sev)&&(!f.cat||x.cat===f.cat)&&(!f.tool||x.tools.includes(f.tool))&&(!f.status||x.status===f.status)&&(!q||(x.title+' '+x.loc+' '+x.rule+' '+x.cat).toLowerCase().includes(q)))
    .sort((a,b)=>ST_ORDER[a.status===`fixed`?'fixed':'new']-ST_ORDER[b.status==='fixed'?'fixed':'new']||SEV.indexOf(a.sev)-SEV.indexOf(b.sev)||ST_ORDER[a.status]-ST_ORDER[b.status]||a.title.localeCompare(b.title));
  let groups;const g=S.ui.group;
  if(g==='severity')groups=SEV.map(s=>({label:SEV_L[s],sev:s,items:items.filter(x=>x.sev===s)}));
  else if(g==='file'){const m=new Map();items.forEach(x=>{const k=fileKey(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});groups=[...m].map(([k,v])=>({label:k,mono:k!=='Dependencies',items:v})).sort((a,b)=>b.items.length-a.items.length)}
  else if(g==='tool')groups=TOOL_IDS.map(t=>({label:TOOLS[t].name,items:items.filter(x=>x.tools.includes(t))}));
  else groups=[{label:'',items}];
  groups=groups.filter(x=>x.items.length);
  const flat=[];groups.forEach(gr=>gr.items.forEach(it=>flat.push(it)));
  return {groups,flat,total:items.length};
}
function rowHtml(f,i){
  const mark=f.status==='new'?'+':f.status==='fixed'?'−':' ';

    <span class="sev ${f.sev}"><i class="sd ${f.sev}"></i>${SEV_L[f.sev]}</span>

      <div class="fr-s"><span class="mono">${esc(f.loc)}</span><span class="sep">·</span><span>${f.cat}</span><span class="sep">·</span><span class="mono" style="color:var(--t3)">${esc(f.rule.length>40?f.rule.split('.').slice(-1)[0]:f.rule)}</span>${f.fix?`<span class="sep">·</span><span class="fix">${esc(f.fix)}</span>`:''}</div></div>
    <div class="fr-tools">${toolTags(f.tools)}</div></div>`;
}
function renderList(){
  const el=$('#flist');if(!el)return;
  const L=computeList();S.L=L;
  if(S.ui.sel>=L.flat.length)S.ui.sel=Math.max(0,L.flat.length-1);
  let i=0,h='';
  if(!L.flat.length)h=`<div class="empty"><div>ไม่มี finding ที่ตรงกับตัวกรอง</div><button class="btn sm" data-act="clear-filters">ล้างตัวกรอง</button></div>`;
  L.groups.forEach(g=>{if(g.label)h+=`<div class="fg">${g.sev?`<i class="sd ${g.sev}"></i>`:''}<span class="${g.mono?'mono':''}">${esc(g.label)}</span><span class="mono">${g.items.length}</span></div>`;g.items.forEach(f=>{h+=rowHtml(f,i++)})});
  el.innerHTML=h;
  const c=$('#fcount');if(c)c.textContent=`${L.total} รายการ`;
  if(S.ui.drawer&&!L.flat.some(x=>x.id===S.ui.drawer))S.ui.drawer=null;
  renderDrawer();icons();
}
function refsFor(f){
  const r=[];
  if(/^CVE-/.test(f.rule)){r.push(['NVD · '+f.rule,'https://nvd.nist.gov/vuln/detail/'+f.rule]);r.push(['GitHub Advisory','https://github.com/advisories?query='+f.rule])}
  if(f.tools.includes('semgrep')&&f.rule.includes('.'))r.push(['Semgrep rule','https://semgrep.dev/r/'+f.rule]);
  if(f.tools.includes('sonarqube')){const m=f.rule.match(/S(\d+)/);if(m)r.push(['Sonar rule S'+m[1],'https://rules.sonarsource.com/go/RSPEC-'+m[1]])}
  if(/CKV_/.test(f.rule))r.push(['Checkov policy '+f.rule.split(' ')[0],'https://www.checkov.io/5.Policy%20Index/all.html']);
  if(f.cat==='Secret')r.push(['Gitleaks rules','https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml']);
  return r;
}
function descFor(f){
  if(f.desc)return f.desc;

  return ({Secret:'พบ credential ในไฟล์ที่ commit ขึ้น git แม้ลบไฟล์แล้ว ค่าเดิมยังอยู่ใน history ต้อง rotate ทันที',
    Misconfiguration:'การตั้งค่านี้ขัดกับ CIS benchmark และแนวทาง hardening ของ container และ Kubernetes',

    'Code smell':'ไม่ใช่ช่องโหว่ แต่ทำให้โค้ดดูแลยากและเพิ่มโอกาสเกิด bug ในอนาคต',
    'Security hotspot':'โค้ดส่วนนี้เกี่ยวข้องกับความปลอดภัย ต้องมีคนตรวจว่าใช้งานอย่างปลอดภัยหรือไม่',
    Vulnerability:'โค้ดส่วนนี้เปิดช่องให้ข้อมูลจากผู้ใช้เข้าถึงส่วนที่ไม่ควรเข้าถึงได้'})[f.cat];
}
function snipFor(f){
  if(f.snip)return f.snip;
  if(f.loc.includes('@')){
    const [pkg,ver]=f.loc.split('@');const lang=S.cur.repo.lang;
    if(lang==='Go'&&!pkg.startsWith('stdlib')&&!/^(busybox|libssl)/.test(pkg))return {file:'go.mod',start:9,hl:10,lines:['require (',`\t${pkg} ${ver}`,')']};
    if(lang==='TypeScript'||lang==='Node.js')return {file:'package-lock.json',start:412,hl:413,lines:[`    "node_modules/${pkg}": {`,`      "version": "${ver}",`,'      "resolved": "https://registry.npmjs.org/…"']};
  }
  return null;
}

/* ---------- router ---------- */
function render(){
  const [r,a,b]=location.hash.replace(/^#/,'').split('/');
  const root=$('#root');
  if(!S.user&&r!=='login'){location.hash='#login';return}
  if(S.user&&r==='login'){location.hash=setupDone()?'#w':'#setup';return}
  if(S.user&&!setupDone()&&r!=='setup'){location.hash='#setup';return}
  let html;
  switch(r){
    case 'login':html=viewLogin();break;
    case 'setup':html=viewSetup();break;
    case 'projects':html=shell('projects',viewProjects());break;
    case 'connect':html=shell('connect',viewConnect(a));break;
    case 'settings':html=shell('settings',viewSettings());break;
    case 'users':html=shell('users',viewUsers());break;
    default:{const inner=viewWorkspace(a||(S.cur.repo&&S.cur.repo.id),b);html=shell('w',inner)}
  }
  root.innerHTML=html;
  if(r==='w'||!['login','setup','projects','connect','settings','users'].includes(r))renderList();
  icons();
}
window.addEventListener('hashchange',()=>{S.ui.confirm=null;S.ui.menu=false;render()});

/* ---------- events ---------- */
document.addEventListener('submit',e=>{
  if(e.target.id==='login-form'){e.preventDefault();const u=String(new FormData(e.target).get('u')).trim()||'admin';S.user=u;store.set('scanhub-c:user',u);location.hash=setupDone()?'#w':'#setup'}
  if(e.target.id==='add-user'){e.preventDefault();const fd=new FormData(e.target);const u=String(fd.get('u')).trim(),p=String(fd.get('p'));
    if(!/^[a-z0-9._-]{3,}$/i.test(u)){toast('ชื่อผู้ใช้ต้องมีอย่างน้อย 3 ตัว ใช้ a-z 0-9 . _ -');return}
    if(S.users.some(x=>x.u===u)){toast('มีชื่อผู้ใช้นี้แล้ว');return}
    if(p.length<8){toast('รหัสผ่านชั่วคราวต้องมีอย่างน้อย 8 ตัวอักษร');return}
    S.users.push({u,role:String(fd.get('role')),active:true,last:'ยังไม่เคย',pending:true});toast(`เพิ่ม ${u} แล้ว`);render()}
});
document.addEventListener('click',e=>{
  const row=e.target.closest('.fr');
  if(row){S.ui.sel=+row.dataset.i;const f=S.L.flat[S.ui.sel];S.ui.drawer=f?f.id:null;updateSel(false);renderDrawer();return}
  const el=e.target.closest('[data-act]');
  if(!el){if(S.ui.menu&&!e.target.closest('.menu')){S.ui.menu=false;const m=$('#menu');if(m)m.classList.remove('open')}return}
  const act=el.dataset.act, d=el.dataset;
  const keepConfirm=['tok-regen','tool-remove'].includes(act);
  if(!keepConfirm&&S.ui.confirm){S.ui.confirm=null}
  switch(act){
    case 'menu':S.ui.menu=!S.ui.menu;$('#menu').classList.toggle('open',S.ui.menu);break;
    case 'logout':S.user=null;S.ui.menu=false;store.del('scanhub-c:user');location.hash='#login';break;
    case 'toggle-proj':S.ui.closed[d.id]=!S.ui.closed[d.id];el.closest('.tp').classList.toggle('closed');el.setAttribute('aria-expanded',!S.ui.closed[d.id]);break;
    case 'new-project':newProjectModal();break;
    case 'add-repo':addRepoModal(d.project);break;
    case 'pick-scan':location.hash=`#w/${S.cur.repo.id}/${d.no}`;break;
    case 'sev-filter':S.ui.f.sev=S.ui.f.sev===d.sev?'':d.sev;S.ui.sel=0;$$('.dist-leg button').forEach(b=>{const on=b.dataset.sev===S.ui.f.sev;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});const ss=$('[data-bind="sev"]');if(ss)ss.value=S.ui.f.sev;renderList();break;
    case 'clear-filters':S.ui.f={q:'',sev:'',cat:'',tool:'',status:''};render();break;
    case 'close-drawer':S.ui.drawer=null;renderDrawer();break;
    case 'scan-now':scanNow();break;
    case 'setup-tool':S.setup.sel.has(d.t)?S.setup.sel.delete(d.t):S.setup.sel.add(d.t);render();break;
    case 'setup-next':S.setup.step++;render();break;
    case 'setup-back':S.setup.step--;render();break;
    case 'setup-install':runInstall();break;
    case 'setup-finish':store.set('scanhub-c:setup','1');S.ui.ctools=null;location.hash='#w';break;
    case 'auto-toggle':S.auto.enabled=!S.auto.enabled;render();break;
    case 'auto-db':S.auto.db=!S.auto.db;render();break;
    case 'tok-show':S.ui.tokenShown=!S.ui.tokenShown;render();break;
    case 'copy-token':copy(S.tokens[S.cur.repo.id],el);break;
    case 'tok-regen':if(S.ui.confirm==='regen'){S.tokens[S.cur.repo.id]='shp_'+hex(rng(Date.now()%1e7),32);S.ui.confirm=null;S.ui.tokenShown=true;toast('สร้าง token ใหม่แล้ว อัปเดต secret ใน CI ด้วย')}else S.ui.confirm='regen';render();break;
    case 'ctool':{const t=d.t,c=S.ui.ctools;const i=c.indexOf(t);if(i>=0){if(c.length>1)c.splice(i,1)}else c.push(t);S.ui.ctools=TOOL_IDS.filter(x=>c.includes(x));render();break}
    case 'gate':S.ui.gate=!S.ui.gate;render();break;
    case 'ctab':S.ui.connectTab=d.k;render();break;
    case 'copy-code':copy(snippets(S.cur.repo)[S.ui.connectTab].code,el);break;
    case 'copy-hook':copy(`${S.server.url}/hooks/git/${S.cur.repo.name}`,el);break;
    case 'save-git':toast('บันทึกการเชื่อมต่อแล้ว สแกนครั้งแรกจะเริ่มภายใน 1 นาที');break;
    case 'tool-update':{const t=d.t;S.tools[t].status='updating';render();setTimeout(()=>{S.tools[t].status='ok';S.tools[t].updated=fmtDate(new Date(NOW.getTime()+60000));toast(`${TOOLS[t].name} เป็นเวอร์ชันล่าสุดแล้ว`);if(location.hash==='#settings')render()},1400);break}
    case 'tool-remove':if(S.ui.confirm==='rm-'+d.t){S.tools[d.t].installed=false;S.ui.confirm=null;S.ui.ctools=null;toast(`ลบ ${TOOLS[d.t].name} แล้ว`)}else S.ui.confirm='rm-'+d.t;render();break;
    case 'tool-add':S.tools[d.t].installed=true;S.tools[d.t].status='ok';S.tools[d.t].updated=fmtDate(NOW);S.ui.ctools=null;toast(`ติดตั้ง ${TOOLS[d.t].name} แล้ว`);render();break;
    case 'update-all':installed().forEach(t=>S.tools[t].status='updating');render();setTimeout(()=>{installed().forEach(t=>{S.tools[t].status='ok';S.tools[t].updated=fmtDate(new Date(NOW.getTime()+120000))});toast('อัปเดต scanner และฐานข้อมูลช่องโหว่แล้ว');if(location.hash==='#settings')render()},1800);break;
    case 'save-general':toast('บันทึกแล้ว');break;
    case 'reset-pw':{const u=S.users[+d.i];u.pending=true;const tmp=hex(rng(Date.now()%1e6),10);toast(`รหัสผ่านชั่วคราวของ ${u.u}: ${tmp}`);render();break}
    case 'toggle-user':{const u=S.users[+d.i];u.active=!u.active;toast(u.active?`เปิดใช้งาน ${u.u} แล้ว`:`ปิดใช้งาน ${u.u} แล้ว มีผลทันที`);render();break}
  }
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  if(b==='q'){S.ui.f.q=e.target.value;S.ui.sel=0;renderList()}
  if(b==='auto-time')S.auto.time=e.target.value;
  if(b==='server-url')S.server.url=e.target.value.trim()||S.server.url;
});
document.addEventListener('change',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;const v=e.target.value;
  if(['sev','cat','tool','status'].includes(b)){S.ui.f[b]=v;S.ui.sel=0;if(b==='sev')$$('.dist-leg button').forEach(x=>{const on=x.dataset.sev===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});renderList()}
  if(b==='group'){S.ui.group=v;S.ui.sel=0;renderList()}
  if(b==='repo-pick')location.hash='#w/'+v;
  if(b==='connect-repo'){S.ui.tokenShown=false;location.hash='#connect/'+v}
  if(b==='retention')S.server.retention=v;
  if(b==='role'){const u=S.users[+e.target.dataset.i];u.role=v;toast(`เปลี่ยน role ของ ${u.u} เป็น ${v} แล้ว`)}
  if(b==='auto-time'&&location.hash==='#settings')render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal')){closeModal();return}
  const r=location.hash.replace(/^#/,'').split('/')[0];
  if(r!=='w'&&r!=='')return;
  const t=e.target,typing=/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
  if(e.key==='Escape'){if(typing){t.blur();return}if(S.ui.drawer){S.ui.drawer=null;renderDrawer()}return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const L=S.L.flat;
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();S.ui.sel=Math.min(L.length-1,S.ui.sel+1);if(S.ui.drawer&&L[S.ui.sel])S.ui.drawer=L[S.ui.sel].id;updateSel(true);renderDrawer()}
  else if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();S.ui.sel=Math.max(0,S.ui.sel-1);if(S.ui.drawer&&L[S.ui.sel])S.ui.drawer=L[S.ui.sel].id;updateSel(true);renderDrawer()}
  else if(e.key==='Enter'){if(t.closest&&t.closest('a,button'))return;const f=L[S.ui.sel];if(f){S.ui.drawer=f.id;renderDrawer()}}
  else if(e.key==='/'){e.preventDefault();const q=$('#q');if(q)q.focus()}
  else if(e.key==='['||e.key===']'){const {repo,scan}=S.cur;if(!scan)return;const s=scansOf(repo.id)[scan.idx+(e.key==='['?-1:1)];if(s)location.hash=`#w/${repo.id}/${s.no}`}
});
function scanNow(){
  const repo=S.cur.repo;if(S.ui.scanning)return;S.ui.scanning=true;render();
  setTimeout(()=>{
    const scans=scansOf(repo.id), last=scans[scans.length-1], r=rng(Date.now()%1e6);
    const tools=installed().filter(t=>ALLT.includes(t)).map(t=>({id:t,status:'ok',dur:Math.round(10+r()*120)}));
    const date=last&&last.date>NOW?new Date(last.date.getTime()+5*60000):new Date(NOW.getTime()+(scans.length%7)*60000);
    const s={id:repo.id+'-'+((last?last.no:0)+1),repoId:repo.id,idx:scans.length,no:(last?last.no:0)+1,date,sha:last?last.sha:hex(r,7),branch:repo.branch,trigger:'manual',tools,duration:Math.max(30,...tools.map(t=>t.dur))+18};
    S.scans[repo.id]=scans.concat(s);S.ui.scanning=false;
    toast(`สแกน ${repo.name} เสร็จ ไม่มี finding ใหม่`);
    location.hash=`#w/${repo.id}/${s.no}`;
  },2200);
}

if(!location.hash)location.hash=S.user?(setupDone()?'#w':'#setup'):'#login';
render();
</script>
