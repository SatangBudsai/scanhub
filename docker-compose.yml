# ScanHub: this is the only file you need. Edit the 3 required values, then run:  docker compose up -d
# Everything runs in one container: the web app, PostgreSQL and every scanner.
# Update to the newest version:  docker compose pull  then  docker compose up -d
#
# Lines that start with # are optional. Remove the # to use them.

services:
  scanhub:
    # :latest follows every release. Pin a version (e.g. :1.1.0) to update only when you choose.
    image: ghcr.io/satangbudsai/scanhub:latest
    ports:
      - "8080:8080"            # change the left number to use another port
    volumes:
      - scanhub-data:/data     # database, settings, results
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      # ---- Required ----
      # Admin login. Re-applied on every start: change it here and restart to change it.
      SCANHUB_ADMIN_USER: ${SCANHUB_ADMIN_USER:-admin}
      # At least 8 characters. ScanHub will not start until you change it.
      SCANHUB_ADMIN_PASSWORD: ${SCANHUB_ADMIN_PASSWORD:-change-me-please}
      # The URL people and CI use to reach ScanHub (used in CI snippets and share links)
      SCANHUB_URL: ${SCANHUB_URL:-http://localhost:8080}

      # ---- Optional ----
      # Use an existing PostgreSQL instead of the one inside the container
      # DATABASE_URL: postgres://scanhub:password@db.example.com:5432/scanhub

      # Your SonarQube server (both needed). Set here = read-only in the settings page
      # SONAR_URL: https://sonarqube.example.com
      # SONAR_TOKEN: squ_xxxxxxxxxxxxxxxx

      # Semgrep rules (passed to semgrep --config). Registry rules such as p/default are under the
      # Semgrep Rules License (internal use only, https://semgrep.dev/legal/rules-license): set the second line to accept it.
      # SEMGREP_RULES: p/default
      # SEMGREP_RULES_LICENSE_ACCEPTED: "true"

      # NVD API key for OWASP Dependency-Check (much faster first database download)
      # NVD_API_KEY: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

      # GitHub connection for one-click CI setup (and fewer rate limits when updating scanners)
      # GITHUB_TOKEN: github_pat_xxxxxxxx
      # GitHub Enterprise only
      # GITHUB_API_URL: https://github.example.com/api/v3

      # GitLab connection for one-click CI setup (gitlab.com or your own server)
      # GITLAB_URL: https://gitlab.com
      # GITLAB_TOKEN: glpat-xxxxxxxx

      # Time zone for the daily scanner update and scheduled scans
      # TZ: Asia/Bangkok
      # Scans that run at the same time
      # SCAN_CONCURRENCY: "1"
      # Max source upload from CI, in MB
      # MAX_UPLOAD_MB: "500"

volumes:
  scanhub-data:
