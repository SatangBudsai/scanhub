<!-- ScanHub report. Styling follows unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 -->
<style id="mainStyle">
/* The chrome (toolbar, page, prompts) follows the app theme; the sheet itself is paper and stays light, and print is always light */
:root{
  --bg:#ececee;--card:#ffffff;--raised:#f4f4f5;--sunk:#f7f7f8;
  --line:rgba(23,23,23,.08);--line2:rgba(23,23,23,.14);--line3:rgba(23,23,23,.24);
  --t1:#171717;--t2:#525252;--t3:#737373;--zero:#c4c4c4;
  --acc:#3b6fd8;--acc-hover:#335fbd;--acc-ink:#ffffff;--acc-soft:rgba(59,111,216,.07);--acc-line:rgba(59,111,216,.35);--acc-text:#2f5fc4;
  --pos:#16a34a;--pos-soft:rgba(22,163,74,.08);--neg:#dc2626;--neg-soft:rgba(220,38,38,.06);
  --crit:#dc2626;--high:#ea580c;--med:#ca8a04;--low:#64748b;--info:#a3a3a3;
  --ct-crit:#b91c1c;--ct-high:#c2410c;--ct-med:#a16207;
  --hl:rgba(220,38,38,.07);
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/22px var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--acc-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
b{font-weight:500}
svg.ic{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t2{color:var(--t2)}.t3{color:var(--t3)}.pos{color:var(--pos)}.neg{color:var(--ct-crit)}
.small{font-size:12px;line-height:16px}

/* toolbar (screen only) */
.toolbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toolbar-in{max-width:calc(210mm + 48px);margin:0 auto;height:56px;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--t1)}
.brand-lockup{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;color:var(--t1);line-height:1}
.brand-lockup .brand-mark{display:block;width:24px;height:24px;flex:none;color:var(--acc-text)}
.brand-lockup .brand-name{font:600 17px/24px var(--sans);letter-spacing:-.35px}
.state .brand-mark{width:30px;height:30px}
.state .brand-name{font-size:22px;line-height:30px;letter-spacing:-.5px}
.report-brand{color:var(--t1);margin-bottom:20px;break-inside:avoid}
.report-brand .brand-lockup{display:inline-flex}
.toolbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;background:var(--card);border:1px solid var(--line2);color:var(--t1);white-space:nowrap;transition:background-color .14s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--raised);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-primary{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:500}
.btn-primary:hover{background:var(--acc-hover)}

/* sheet */
.page{padding:32px 24px 96px}
.sheet{max-width:210mm;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:20mm 18mm 16mm}
.eyebrow{font-size:12px;line-height:16px;color:var(--t3);display:flex;align-items:center;gap:8px}
.eyebrow svg{width:14px;height:14px}
h1{font-size:30px;line-height:38px;font-weight:500;margin:12px 0 0;letter-spacing:-.01em}
.prepared{font-size:15px;color:var(--t2);margin:4px 0 0}
.metagrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px;margin:28px 0 0;padding:20px 0 0;border-top:1px solid var(--line2)}
.metagrid dt{font-size:12px;line-height:16px;color:var(--t3)}
.metagrid dd{margin:4px 0 0;overflow-wrap:anywhere}
.metagrid .span2{grid-column:span 2}
section.block{margin-top:40px}
h2{font-size:18px;line-height:26px;font-weight:500;margin:0 0 12px}
.summary-text{font-size:15px;line-height:26px;margin:0;max-width:150mm}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border:1px solid var(--line);border-radius:10px}
.nums>div{padding:14px 16px}
.nums>div+div{border-left:1px solid var(--line)}
.nums .k{font-size:12px;color:var(--t2)}
.nums .v{font-size:26px;line-height:34px;font-weight:500;font-variant-numeric:tabular-nums}
.nums .d{font-size:12px;line-height:16px;color:var(--t3)}
.sevbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--raised);margin-top:24px}
.sevbar span{display:block;min-width:4px}
.sevlegend{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:12px}
.sevlegend .it{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
.sevlegend .n{font:500 15px/1 var(--mono);color:var(--t1)}
.sevlegend .zero,.sevlegend .zero .n{color:var(--t3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.s-critical{background:var(--crit)}.s-high{background:var(--high)}.s-medium{background:var(--med)}.s-low{background:var(--low)}.s-info{background:var(--info)}
.c-critical{color:var(--ct-crit)}.c-high{color:var(--ct-high)}.c-medium{color:var(--ct-med)}.c-low{color:var(--low)}.c-info{color:var(--t3)}
.scope{margin-top:16px;font-size:12px;line-height:18px;color:var(--t3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;line-height:16px;font-weight:400;color:var(--t3);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line2)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;padding-right:24px;white-space:nowrap}
td:last-child,th:last-child{padding-right:0}
.scan-tbl th:first-child{width:34%}
.st-ok{color:var(--pos)}.st-failed{color:var(--ct-crit)}.st-skipped{color:var(--t3)}

/* findings */
.sev-group{margin-top:40px}
.sev-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sev-h h2{margin:0;display:flex;align-items:center;gap:10px}
.sev-h .cnt{font-size:13px;color:var(--t3)}
.finding{padding:20px 0;border-bottom:1px solid var(--line)}
.f-top{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:baseline}
.f-id{font:500 12px/20px var(--mono);color:var(--t3)}
.f-title{font-size:15px;line-height:22px;font-weight:500}
.tag{font-size:12px;line-height:16px;padding:2px 8px;border-radius:10px;border:1px solid var(--line2);white-space:nowrap}
.tag-new{color:var(--acc-text);border-color:var(--acc-line);background:var(--acc-soft)}
.tag-fixed{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 30%,transparent);background:var(--pos-soft)}
.f-body{margin-left:64px}
.f-meta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 16px;font-size:13px;line-height:20px;margin:10px 0 0}
.f-meta dt{color:var(--t3)}
.f-meta dd{margin:0;overflow-wrap:anywhere}
.f-desc{margin:12px 0 0;color:var(--t2);max-width:150mm}
.code{margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.code-h{font:400 12px/16px var(--mono);color:var(--t3);padding:8px 12px;border-bottom:1px solid var(--line)}
.code pre{margin:0;padding:8px 12px;font:400 12px/19px var(--mono);color:#262626;white-space:pre-wrap;overflow-wrap:anywhere}
.code .ln{color:#b4b4b4;display:inline-block;width:36px;user-select:none}
.code .hl{display:inline-block;min-width:calc(100% + 24px);vertical-align:top;background:var(--hl);margin:0 -12px;padding:0 12px;box-shadow:inset 2px 0 0 var(--crit)}
.fix{margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-left:2px solid var(--t2);border-radius:6px;background:var(--sunk);max-width:150mm}
.fix .k{font-size:12px;color:var(--t3)}
.refs{margin:12px 0 0;padding:0;list-style:none;font-size:12px;line-height:18px}
.refs li{overflow-wrap:anywhere}
.refs .k{color:var(--t3)}
.none{padding:24px 0;color:var(--t3)}
.foot{margin-top:48px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--t3)}

/* states */
.state{max-width:400px;margin:12vh auto 0;padding:0 16px}
.state h1{font-size:24px;line-height:32px;margin:24px 0 4px}
.state p{color:var(--t2);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--t2)}
.input{height:40px;width:100%;background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:0 12px}
.input:focus{outline:none;border-color:var(--acc)}
.err{font-size:13px;color:var(--ct-crit);min-height:20px;margin-top:8px}
.state .icon{width:24px;height:24px;color:var(--t3)}
.loading{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--t3);margin-top:20vh}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media screen and (max-width:820px){
  .page{padding:16px 0 64px}
  .sheet{border-radius:0;border-left:0;border-right:0;padding:24px 16px}
  .metagrid{grid-template-columns:1fr 1fr}.metagrid .span2{grid-column:1/-1}
  .nums{grid-template-columns:1fr}.nums>div+div{border-left:0;border-top:1px solid var(--line)}
  .f-top{grid-template-columns:44px minmax(0,1fr)}.f-top .tag{grid-column:2;justify-self:start}
  .f-body{margin-left:0}
  .toolbar-in{padding:0 16px;gap:8px}.toolbar .lbl{display:none}
  .scan-tbl{display:block;overflow-x:auto}
}
/* print has its own fixed layout: the A4 content box is ~690px wide, so no screen breakpoint may leak in */
@media print{
  html,body{background:#fff;font-size:10.5pt;line-height:1.55}
  .toolbar{display:none!important}
  .page{padding:0}
  .sheet{max-width:none;width:auto;border:0;border-radius:0;box-shadow:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:var(--t1);text-decoration:none}
  h1{font-size:22pt;line-height:1.2}
  h2{font-size:13pt}
  .metagrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metagrid .span2{grid-column:span 2}
  .nums{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nums>div+div{border-left:1px solid var(--line);border-top:0}
  .f-top{grid-template-columns:44px minmax(0,1fr) auto}
  .f-top .tag{grid-column:auto;justify-self:end}
  .f-body{margin-left:56px}
  .scan-tbl{display:table;overflow:visible}
  thead{display:table-header-group}
  tr,td,th{break-inside:avoid}
  .code pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .mono,dd,td,.refs li,.f-title{overflow-wrap:anywhere;word-break:break-word}
  h1,h2,.sev-h{break-after:avoid}
  .finding,.nums,.code,.fix,.sevlegend,.sevbar{break-inside:avoid}
  .sev-group{break-before:page;margin-top:0}
  .foot{display:none}
  .spin{animation:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141415;--card:#19191b;--raised:#232325;--sunk:#111112;--topbar:rgba(20,20,21,.9);--field:#161617;--line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.12);--line3:rgba(237,237,237,.22);--t1:#ededed;--t2:#a1a1a6;--t3:#85858b;--acc:#8fb4ff;--acc-hover:#a3c1ff;--acc-ink:#0e1626;--acc-soft:rgba(143,180,255,.1);--acc-line:rgba(143,180,255,.4);--acc-text:#8fb4ff;--pos:#4cc38a;--ct-crit:#f08a8d;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#141415;--card:#19191b;--raised:#232325;--sunk:#111112;--topbar:rgba(20,20,21,.9);--field:#161617;--line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.12);--line3:rgba(237,237,237,.22);--t1:#ededed;--t2:#a1a1a6;--t3:#85858b;--acc:#8fb4ff;--acc-hover:#a3c1ff;--acc-ink:#0e1626;--acc-soft:rgba(143,180,255,.1);--acc-line:rgba(143,180,255,.4);--acc-text:#8fb4ff;--pos:#4cc38a;--ct-crit:#f08a8d;color-scheme:dark;}
.sheet{--bg:#ececee;--card:#ffffff;--raised:#f4f4f5;--sunk:#f7f7f8;--topbar:rgba(236,236,238,.92);--field:#ffffff;--line:rgba(23,23,23,.08);--line2:rgba(23,23,23,.14);--line3:rgba(23,23,23,.24);--t1:#171717;--t2:#525252;--t3:#737373;--acc:#3b6fd8;--acc-hover:#335fbd;--acc-ink:#ffffff;--acc-soft:rgba(59,111,216,.07);--acc-line:rgba(59,111,216,.35);--acc-text:#2f5fc4;--pos:#16a34a;--ct-crit:#b91c1c;color-scheme:light;color:var(--t1);background:var(--card)}
.toolbar{background:var(--topbar)}
.btn{box-shadow:none}
@media print{html:root,html:root[data-theme]{--bg:#ececee;--card:#ffffff;--raised:#f4f4f5;--sunk:#f7f7f8;--topbar:rgba(236,236,238,.92);--field:#ffffff;--line:rgba(23,23,23,.08);--line2:rgba(23,23,23,.14);--line3:rgba(23,23,23,.24);--t1:#171717;--t2:#525252;--t3:#737373;--acc:#3b6fd8;--acc-hover:#335fbd;--acc-ink:#ffffff;--acc-soft:rgba(59,111,216,.07);--acc-line:rgba(59,111,216,.35);--acc-text:#2f5fc4;--pos:#16a34a;--ct-crit:#b91c1c;color-scheme:light;}}
</style>

<body>
<div class="toolbar" id="toolbar" hidden><div class="toolbar-in">
  <a class="brand" href="/" id="home" aria-label="ScanHub"></a>
  <span class="sp"></span>
  <button class="btn" id="dl" aria-label="ดาวน์โหลด HTML" title="ดาวน์โหลดเป็นไฟล์ HTML"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">ดาวน์โหลด HTML</span></button>
  <button class="btn btn-primary" id="pdf"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/></svg>บันทึกเป็น PDF</button>
</div></div>
<div id="root"><div class="loading"><svg class="ic spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>กำลังโหลดรายงาน</div></div>

<script>
try { const t = JSON.parse(localStorage.getItem('scanhub.theme') || '"system"'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TMF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const toD = v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
const fmt = v => { const d = toD(v); return d ? `${d.getDate()} ${TM[d.getMonth()]} ${d.getFullYear() + 543} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '—'; };
const fmtLong = v => { const d = toD(v); return d ? `${d.getDate()} ${TMF[d.getMonth()]} ${d.getFullYear() + 543}` : '—'; };
const dur = ms => { if (ms == null) return '—'; const s = Math.round(ms / 1000); return s >= 3600 ? `${Math.floor(s / 3600)}h ${pad(Math.floor(s % 3600 / 60))}m` : s >= 60 ? `${Math.floor(s / 60)}m ${pad(s % 60)}s` : `${s}s`; };
const sum = a => (a || []).reduce((x, y) => x + (y || 0), 0);
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } };
const SEV = ['critical', 'high', 'medium', 'low', 'info'];
const SEVL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low', info: 'Info' };
const SEVP = { critical: 'C', high: 'H', medium: 'M', low: 'L', info: 'I' };
const TOOLNAME = { sonarqube: 'SonarQube', trivy: 'Trivy', semgrep: 'Semgrep', gitleaks: 'Gitleaks', 'dependency-check': 'OWASP Dependency-Check', checkov: 'Checkov', grype: 'Grype' };
const toolName = id => TOOLNAME[id] || String(id);
const TRIG = { ci: 'CI', manual: 'สั่งสแกนเอง', schedule: 'ตามเวลา', upload: 'ส่งผลจาก CI' };
const RUNST = { ok: 'สำเร็จ', failed: 'ล้มเหลว', skipped: 'ข้าม' };
const ICON = {
  lock: '<svg class="ic icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  user: '<svg class="ic icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  alert: '<svg class="ic icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  clock: '<svg class="ic icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  shield: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/></svg>'
};
// Reuse the toolbar mark so report states and downloaded HTML retain the same identity.
$('#home').innerHTML = ScanHubBrand.logo;
const MARK = '<div class="brand">' + ScanHubBrand.logo + '</div>';

/* ---------- mode ---------- */
const shareM = location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)\/?$/);
const SHARE = shareM ? shareM[1] : null;
const QS = new URLSearchParams(location.search);
const REPORT_KEYS = ['minSeverity', 'includeFixed', 'includeSnippets', 'title', 'preparedFor'];
let REPORT = null;

async function getJson(url, opts) {
  let r;
  try { r = await fetch(url, { credentials: 'same-origin', ...opts }); }
  catch (e) { return { status: 0, data: { error: 'เชื่อมต่อ server ไม่ได้' } }; }
  let data = null; try { data = await r.json(); } catch (e) {}
  return { status: r.status, data: data || {} };
}
async function load() {
  if (SHARE) {
    const { status, data } = await getJson(`/api/share/${encodeURIComponent(SHARE)}`);
    if (status === 200 && data.report) return showReport(data.report);
    if (status === 401 && data.code === 'PASSWORD_REQUIRED') return showPassword();
    if (status === 401) return showLogin(`/s/${SHARE}`);
    if (status === 403 && data.code === 'NO_ACCESS') return showState(ICON.lock, 'บัญชีนี้ไม่มีสิทธิ์ดูโปรเจกต์นี้', 'ติดต่อ admin เพื่อขอสิทธิ์ในโปรเจกต์นี้ หรือออกจากระบบแล้วเข้าด้วยบัญชีที่มีสิทธิ์');
    if (status === 404) return showState(ICON.alert, 'ไม่พบลิงก์นี้', 'ลิงก์อาจพิมพ์ไม่ครบ หรือถูกยกเลิกแล้ว ติดต่อผู้ที่ส่งลิงก์ให้คุณเพื่อขอลิงก์ใหม่');
    if (status === 410) return showState(ICON.clock, 'ลิงก์หมดอายุแล้ว', 'ลิงก์รายงานนี้หมดอายุแล้ว ติดต่อผู้ที่ส่งลิงก์ให้คุณเพื่อขอลิงก์ใหม่');
    return showState(ICON.alert, 'เปิดรายงานไม่สำเร็จ', data.error || 'ลองใหม่อีกครั้ง', true);
  }
  const scan = QS.get('scan');
  if (!scan) return showState(ICON.alert, 'ไม่ได้ระบุสแกน', 'เปิดรายงานจากหน้า repo ใน ScanHub แล้วกด "รายงาน"');
  const p = new URLSearchParams();
  REPORT_KEYS.forEach(k => { if (QS.has(k)) p.set(k, QS.get(k)); });
  const { status, data } = await getJson(`/api/scans/${encodeURIComponent(scan)}/report?${p}`);
  if (status === 200) return showReport(data);
  if (status === 401) return showLogin(location.pathname + location.search);
  if (status === 404) return showState(ICON.alert, 'ไม่พบสแกนนี้', 'สแกนอาจถูกลบตามระยะเวลาเก็บประวัติแล้ว');
  return showState(ICON.alert, 'เปิดรายงานไม่สำเร็จ', data.error || 'ลองใหม่อีกครั้ง', true);
}

/* ---------- states ---------- */
function showState(icon, title, text, retry) {
  $('#toolbar').hidden = true;
  $('#root').innerHTML = `<div class="state">${MARK}<div style="margin-top:32px">${icon}</div><h1>${esc(title)}</h1><p>${esc(text)}</p>${retry ? '<button class="btn" id="retry">ลองอีกครั้ง</button>' : ''}</div>`;
  const r = $('#retry'); if (r) r.onclick = () => location.reload();
}
function showLogin(next) {
  $('#toolbar').hidden = true;
  $('#root').innerHTML = `<div class="state">${MARK}<div style="margin-top:32px">${ICON.user}</div><h1>ต้อง login</h1><p>รายงานนี้เปิดได้เฉพาะผู้ใช้ ScanHub เข้าสู่ระบบแล้วจะกลับมาที่รายงานนี้</p><a class="btn btn-primary" href="/#login?next=${encodeURIComponent(next)}">เข้าสู่ระบบ</a></div>`;
}
function showPassword() {
  $('#toolbar').hidden = true;
  $('#root').innerHTML = `<div class="state">${MARK}<div style="margin-top:32px">${ICON.lock}</div><h1>รายงานนี้ล็อกด้วยรหัสผ่าน</h1><p>ใส่รหัสผ่านที่ได้รับพร้อมลิงก์</p>
    <form id="pw" novalidate><div class="field"><label for="pwi">รหัสผ่าน</label><input class="input" id="pwi" type="password" autocomplete="off"></div>
    <div class="err" id="pwe"></div><button class="btn btn-primary" style="width:100%;height:40px" id="pwb">เปิดรายงาน</button></form></div>`;
  $('#pwi').focus();
  $('#pw').onsubmit = async e => {
    e.preventDefault();
    const v = $('#pwi').value; if (!v) { $('#pwe').textContent = 'กรอกรหัสผ่าน'; return; }
    $('#pwb').disabled = true; $('#pwe').textContent = '';
    const { status, data } = await getJson(`/api/share/${encodeURIComponent(SHARE)}/unlock`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: v }) });
    if (status === 200) return load();
    $('#pwb').disabled = false; $('#pwi').select();
    $('#pwe').textContent = status === 429 ? 'ใส่รหัสผิดหลายครั้งเกินไป รอ 15 นาทีแล้วลองใหม่' : status === 401 ? 'รหัสผ่านไม่ถูกต้อง' : status === 404 || status === 410 ? 'ลิงก์นี้ใช้ไม่ได้แล้ว' : (data.error || 'ลองใหม่อีกครั้ง');
  };
}

/* ---------- report ---------- */
function summarySentence(r) {
  const s = r.summary || {}, c = s.counts || [], open = s.openCount != null ? s.openCount : sum(c);
  let t = open ? `การสแกนครั้งนี้พบปัญหาที่ยังเปิดอยู่ ${open} รายการ` : 'การสแกนครั้งนี้ไม่พบปัญหาที่ยังเปิดอยู่';
  if ((c[0] || 0) + (c[1] || 0)) t += ` เป็นระดับ Critical ${c[0] || 0} และ High ${c[1] || 0} รายการ ซึ่งควรแก้ไขเป็นลำดับแรก`;
  else if (open) t += ' ไม่มีระดับ Critical หรือ High';
  if (r.prev) {
    t += ` เมื่อเทียบกับการสแกนครั้งก่อน (#${esc(r.prev.num)}) พบปัญหาใหม่ ${s.newCount || 0} รายการ และแก้ไขแล้ว ${s.fixedCount || 0} รายการ`;
    const nb = s.newBySeverity || {}, nch = (nb.critical || 0) + (nb.high || 0);
    if (nch) t += ` โดยปัญหาใหม่ระดับ Critical และ High มี ${nch} รายการ`;
  }
  return t;
}
function scopeText(o) {
  o = o || {};
  const min = o.minSeverity || 'low';
  const parts = [min === 'info' ? 'แสดงทุกระดับความรุนแรง' : min === 'critical' ? 'แสดงเฉพาะระดับ Critical' : `แสดงระดับ ${SEVL[min] || min} ขึ้นไป`];
  parts.push(o.includeFixed ? 'รวมรายการที่แก้แล้วเทียบกับสแกนก่อนหน้า' : 'ไม่รวมรายการที่แก้แล้ว');
  if (o.includeSnippets === false) parts.push('ไม่แสดงโค้ด');
  return 'ขอบเขตรายการด้านล่าง: ' + parts.join(' · ') + ' ตัวเลขสรุปด้านบนนับทุกระดับ';
}
function codeBlock(f) {
  const sn = f.snippet; if (!sn || !sn.lines || !sn.lines.length) return '';
  const start = +sn.start || 1, hl = +(sn.hl || f.line || 0);
  return `<div class="code"><div class="code-h">${esc(f.file || String(f.location || '').split(':')[0])}</div><pre>${sn.lines.map((l, i) => { const ln = start + i, t = `<span class="ln">${ln}</span>${esc(String(l).replace(/\t/g, '  '))}`; return ln === hl ? `<span class="hl">${t}</span>` : t; }).join('\n')}</pre></div>`;
}
function refsList(f) {
  const urls = [...new Set((f.refs || []).map(safeUrl).filter(Boolean))];
  if (!urls.length) (f.rules || []).forEach(r => { if (/^CVE-\d+-\d+$/i.test(r.id)) urls.push(`https://nvd.nist.gov/vuln/detail/${r.id}`); else if (/^GHSA-/i.test(r.id)) urls.push(`https://github.com/advisories/${r.id}`); });
  if (!urls.length) return '';
  return `<ul class="refs"><li class="k">อ้างอิง</li>${urls.slice(0, 6).map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul>`;
}
function findingHtml(f, id, withCode) {
  const tools = f.tools || [];
  return `<article class="finding">
    <div class="f-top"><span class="f-id">${id}</span><span class="f-title">${esc(f.title)}</span>${f.status === 'new' ? '<span class="tag tag-new">ใหม่</span>' : f.status === 'fixed' ? '<span class="tag tag-fixed">แก้แล้ว</span>' : '<span></span>'}</div>
    <div class="f-body">
      <dl class="f-meta">
        <dt>ประเภท</dt><dd>${esc(f.category)}</dd>
        <dt>ตำแหน่ง</dt><dd class="mono small">${esc(f.location)}</dd>
        ${(f.rules || []).length ? `<dt>Rule</dt><dd class="mono small">${f.rules.map(r => esc(r.id)).filter((v, i, a) => a.indexOf(v) === i).join(', ')}</dd>` : ''}
        <dt>พบโดย</dt><dd>${esc(tools.map(toolName).join(', ') || '—')}</dd>
        ${f.firstSeenNum ? `<dt>พบครั้งแรก</dt><dd>สแกน #${esc(f.firstSeenNum)}</dd>` : ''}
      </dl>
      ${f.description ? `<p class="f-desc">${esc(f.description)}</p>` : ''}
      ${withCode ? codeBlock(f) : ''}
      ${f.fix ? `<div class="fix"><div class="k">วิธีแก้</div>${esc(f.fix)}</div>` : ''}
      ${refsList(f)}
    </div>
  </article>`;
}
function showReport(r) {
  REPORT = r;
  const s = r.summary || {}, c = s.counts || [0, 0, 0, 0, 0], sc = r.scan || {}, repo = r.repo || {}, o = r.options || {};
  const open = s.openCount != null ? s.openCount : sum(c), total = sum(c);
  const title = r.title || `รายงานผลการสแกน ${repo.name || ''}`.trim();
  document.title = `${title} · ScanHub`;
  const withCode = o.includeSnippets !== false;
  const groups = SEV.map(sv => [sv, (r.findings || []).filter(f => f.severity === sv)]).filter(g => g[1].length);
  const runs = r.runs || [];
  const footText = `สร้างโดย ScanHub · ${fmt(r.generatedAt)}`;
  $('#pageStyle').textContent = `@page{size:A4;margin:16mm 14mm;@bottom-left{content:"${footText.replace(/["\\]/g, '')}";font:400 8pt 'IBM Plex Sans Thai',sans-serif;color:#737373}@bottom-right{content:"หน้า " counter(page) " / " counter(pages);font:400 8pt 'IBM Plex Sans Thai',sans-serif;color:#737373}}`;
  $('#toolbar').hidden = false;
  $('#root').innerHTML = `<div class="page"><main class="sheet">
    <header>
      <div class="report-brand">${ScanHubBrand.logo}</div>
      <div class="eyebrow">${ICON.shield}รายงานผลการตรวจสอบความปลอดภัยของซอร์สโค้ด</div>
      <h1>${esc(title)}</h1>
      ${r.preparedFor ? `<p class="prepared">จัดทำให้ ${esc(r.preparedFor)}</p>` : ''}
      <dl class="metagrid">
        <div class="span2"><dt>Repository</dt><dd>${esc(repo.projectName ? repo.projectName + ' / ' : '')}${esc(repo.name)}${repo.lang ? ` <span class="t3">· ${esc(repo.lang)}</span>` : ''}</dd></div>
        <div><dt>วันที่สแกน</dt><dd>${fmtLong(sc.finishedAt || sc.startedAt)}</dd></div>
        <div><dt>การสแกน</dt><dd>#${esc(sc.num)} · ${esc(TRIG[sc.trigger] || sc.trigger || '—')}</dd></div>
        <div><dt>Branch</dt><dd class="mono small">${esc(sc.branch || repo.branch || '—')}</dd></div>
        <div><dt>Commit</dt><dd class="mono small">${esc(sc.commit ? String(sc.commit).slice(0, 12) : '—')}</dd></div>
      </dl>
    </header>

    <section class="block">
      <h2>บทสรุป</h2>
      <p class="summary-text">${summarySentence(r)}</p>
      <div class="nums">
        <div><div class="k">ยังเปิดอยู่</div><div class="v">${open}</div><div class="d">ทุกระดับความรุนแรง</div></div>
        <div><div class="k">พบใหม่</div><div class="v">${s.newCount || 0}</div><div class="d">${r.prev ? `ไม่พบในสแกน #${esc(r.prev.num)}` : 'สแกนแรกของ repo'}</div></div>
        <div><div class="k">แก้แล้ว</div><div class="v ${s.fixedCount ? 'pos' : ''}">${s.fixedCount || 0}</div><div class="d">${r.prev ? `มีในสแกน #${esc(r.prev.num)} แต่ไม่พบแล้ว` : '—'}</div></div>
      </div>
      <div class="sevbar" role="img" aria-label="${SEV.map((v, i) => SEVL[v] + ' ' + (c[i] || 0)).join(', ')}">${total ? SEV.map((v, i) => c[i] ? `<span class="s-${v}" style="flex:${c[i]}"></span>` : '').join('') : ''}</div>
      <div class="sevlegend">${SEV.map((v, i) => `<span class="it ${c[i] ? '' : 'zero'}"><span class="dot s-${v}"></span>${SEVL[v]}<span class="n">${c[i] || 0}</span></span>`).join('')}</div>
    </section>

    <section class="block">
      <h2>ตัวสแกนที่ใช้</h2>
      <table class="scan-tbl"><thead><tr><th>Scanner</th><th>สถานะ</th><th class="r">พบ</th><th class="r">เวลา</th><th>หมายเหตุ</th></tr></thead><tbody>
      ${runs.length ? runs.map(x => `<tr><td>${esc(toolName(x.tool))}</td><td class="st-${esc(x.status)}">${esc(RUNST[x.status] || x.status)}</td><td class="r mono">${x.status === 'ok' && x.count != null ? esc(x.count) : '—'}</td><td class="r mono">${x.status === 'skipped' ? '—' : dur(x.durationMs)}</td><td class="t2">${esc(x.note || '')}</td></tr>`).join('') : '<tr><td colspan="5" class="t3">ไม่มีข้อมูล</td></tr>'}
      </tbody></table>
      <p class="scope">ผลจากทุก scanner ถูกรวมเป็นรายการเดียว ปัญหาเดียวกันที่หลาย scanner พบจะแสดงครั้งเดียว · ${esc(scopeText(o))}</p>
    </section>

    ${groups.length ? groups.map(([sv, fs]) => `<section class="sev-group">
      <div class="sev-h"><h2 class="c-${sv}"><span class="dot s-${sv}"></span>${SEVL[sv]}</h2><span class="cnt">${fs.length} รายการ</span></div>
      ${fs.map((f, i) => findingHtml(f, `${SEVP[sv]}-${i + 1}`, withCode)).join('')}
    </section>`).join('') : '<section class="block"><h2>รายการปัญหา</h2><p class="none">ไม่พบปัญหาในขอบเขตของรายงานนี้</p></section>'}

    <footer class="foot"><span>${esc(footText)}</span><span>${esc(repo.name)} · สแกน #${esc(sc.num)}</span></footer>
  </main></div>`;
}

/* ---------- actions ---------- */
$('#pdf').onclick = () => window.print();
$('#dl').onclick = () => {
  if (!REPORT) return;
  // a static copy: rendered markup only, no scripts, no toolbar
  const doc = document.documentElement.cloneNode(true);
  doc.removeAttribute('data-theme');
  // keep only the report's own head and content; browser extensions may inject nodes and styles
  [...doc.querySelector('head').children].forEach(n => { if (!(n.matches('meta, title, #mainStyle, #pageStyle') || n.matches('link[rel="stylesheet"][href^="https://fonts.googleapis.com/"]'))) n.remove(); });
  [...doc.querySelector('body').children].forEach(n => { if (n.id !== 'root') n.remove(); });
  doc.querySelectorAll('script, iframe, object, embed').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name)) n.removeAttribute(a.name); }));
  const head = doc.querySelector('head');
  const m = document.createElement('meta'); m.setAttribute('name', 'generator'); m.setAttribute('content', 'ScanHub report export');
  head.appendChild(m);
  const html = '<!doctype html>\n' + doc.outerHTML;
  const name = `scanhub-${String((REPORT.repo || {}).name || 'report').replace(/[^\w.-]+/g, '-')}-scan-${(REPORT.scan || {}).num || ''}.html`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
};
load();
</script>
</body>
</html>
